map $http_x_forwarded_proto $charlot_https {
    default $https;
    https on;
}
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 512m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $charlot_https;
        fastcgi_read_timeout 120s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location ~ ^/(assets|storage)/.*\.(php|phtml|phar)$ { return 404; }
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
}
