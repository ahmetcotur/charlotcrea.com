map_hash_bucket_size 128;
map_hash_max_size 2048;
map $request_uri $charlot_request_path {
    ~^([^?]*) $1;
}
map $charlot_request_path $charlot_redirect {
    default "";
    include /etc/nginx/charlot-redirects.conf;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    if ($charlot_redirect != "") {
        return 301 $charlot_redirect$is_args$args;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
}
